<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="CSS/styles.css">
  <title>Formulario de Registro</title>
</head>
<body>

  <div class="form-container">
    <h2 class="form-title">Registro de Usuario</h2>
    
    <form action="#" method="POST">
      
      <div class="form-row">
        <div class="form-group">
          <label for="nombre">Nombre</label>
          <input type="text" id="nombre" name="nombre" required>
        </div>
        <div class="form-group">
          <label for="apellido">Apellido</label>
          <input type="text" id="apellido" name="apellido" required>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="tipo-doc">Tipo de Documento</label>
          <select id="tipo-doc" name="tipo_documento" required>
            <option value="" disabled selected>Seleccione...</option>
            <option value="CC" selected>Cédula de Ciudadanía</option>
            <option value="CE">Cédula de Extranjería</option>

            <option value="TI">Tarjeta de Identidad</option>
          </select>
        </div>
        <div class="form-group">
          <label for="num-doc">Número de Documento</label>
          <input type="number" id="num-doc" name="numero_documento" required>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="fecha-nac">Fecha de Nacimiento</label>
          <input type="date" id="fecha-nac" name="fecha_nacimiento" required>
        </div>
        <div class="form-group">
          <label for="telefono">Teléfono</label>
          <input type="tel" id="telefono" name="telefono" required>
        </div>
      </div>

      <div class="form-group">
        <label for="email">Correo Electrónico</label>
        <input type="email" id="email" name="email" required>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="pais">País de Domicilio</label>
          <select id="pais" name="pais" required>
            <option value="" disabled selected>Seleccione un país</option>
            <option value="169" selected>Colombia</option>
            <option value="493">México</option>
            <option value="063">Argentina</option>
            <option value="211">Chile</option>
            <option value="589">Perú</option>
          </select>
        </div>
        <div class="form-group">
          <label for="ciudad">Ciudad</label>
          <select id="ciudad" name="ciudad" required>
            <option value="" disabled selected>Seleccione una ciudad</option>
            <optgroup label="Colombia">
              <option value="bogota" selected>Bogotá</option>
              <option value="medellin">Medellín</option>
              <option value="cali">Cali</option>
            </optgroup>
            <optgroup label="México">
              <option value="cdmx">Ciudad de México</option>
              <option value="guadalajara">Guadalajara</option>
              <option value="monterrey">Monterrey</option>
            </optgroup>
            <optgroup label="Argentina">
              <option value="buenos_aires">Buenos Aires</option>
              <option value="cordoba">Córdoba</option>
              <option value="rosario">Rosario</option>
            </optgroup>
            <optgroup label="Chile">
              <option value="santiago">Santiago</option>
              <option value="valparaiso">Valparaíso</option>
              <option value="concepcion">Concepción</option>
            </optgroup>
            <optgroup label="Perú">
              <option value="lima">Lima</option>
              <option value="arequipa">Arequipa</option>
              <option value="trujillo">Trujillo</option>
            </optgroup>
          </select>
        </div>
      </div>

      <div class="checkbox-group">
        <input type="checkbox" id="tratamiento-datos" name="tratamiento_datos" required>
        <label for="tratamiento-datos">Acepto el tratamiento de datos personales</label>
      </div>

      <button type="submit" class="btn-submit">Enviar Registro</button>

    </form>
  </div>

</body>
</html>
